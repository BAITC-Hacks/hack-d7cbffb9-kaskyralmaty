[project]
name = "meeting-protocol"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "python-docx==1.2.0",
  "pydantic-ai-slim[openai]==2.48.0", "python-multipart==0.0.32",
]
[project.optional-dependencies]
gpu = [
  "faster-whisper==1.2.1", "ctranslate2==4.8.2", "torch==2.8.0",
  "transformers==4.57.6", "sentencepiece==0.2.2", "protobuf==7.36.2",
  "soundfile==0.13.1", "speechbrain==1.0.3", "torchaudio==2.8.0", "nvidia-cublas-cu12==12.8.4.1", "nvidia-cudnn-cu12==9.10.2.21",
]
[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch", marker = "sys_platform == 'linux'" }]
